<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Pesos | Fresh-Pak</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-app: #f4f7f9;
            --card-bg: #ffffff;
            --primary: #003366;
            --text-label: #8e9aaf;
            --text-main: #2d3436;
            --input-bg: #f1f3f6;
            --border-radius: 24px;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }

        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg-app); margin: 0; color: var(--text-main); padding-bottom: 40px; }
        header { text-align: center; padding: 30px 20px; background: white; border-bottom-left-radius: var(--border-radius); border-bottom-right-radius: var(--border-radius); margin-bottom: 20px; }
        .logo { height: 45px; margin-bottom: 10px; }
        header h1 { font-size: 18px; margin: 0; color: var(--primary); text-transform: uppercase; letter-spacing: 1px; }
        header p { font-size: 12px; color: var(--text-label); margin: 5px 0 0; text-transform: uppercase; }
        .container { max-width: 500px; margin: auto; padding: 0 15px; }
        .card { background: var(--card-bg); padding: 25px; border-radius: var(--border-radius); box-shadow: var(--shadow); margin-bottom: 20px; }
        
        label { display: block; font-size: 11px; font-weight: 800; color: var(--text-label); margin-bottom: 8px; text-transform: uppercase; padding-left: 5px; }
        input, select { width: 100%; padding: 12px; border: none; background: var(--input-bg); border-radius: 12px; box-sizing: border-box; font-size: 14px; color: var(--text-main); margin-bottom: 15px; font-weight: 500; }
        input:focus { outline: 2px solid #dfe6e9; }
        
        /* Contenedor Proporcional corregido */
        .input-group { display: flex; gap: 10px; width: 100%; margin-bottom: 15px; }
        .input-group > div { flex: 1 1 0%; min-width: 0; }
        .input-group input { margin-bottom: 0; }

        button { width: 100%; background: var(--primary); color: white; border: none; padding: 16px; border-radius: 15px; font-weight: 700; text-transform: uppercase; cursor: pointer; transition: 0.3s; }
        button:hover { opacity: 0.9; transform: translateY(-1px); }
        .collapsible-header { display: flex; justify-content: space-between; align-items: center; cursor: pointer; color: var(--primary); font-weight: 700; font-size: 13px; text-transform: uppercase; }
        .collapsible-content { max-height: 0; overflow: hidden; transition: max-height 0.3s ease-out; margin-top: 0; }
        .collapsible-content.open { max-height: 1000px; margin-top: 20px; }
        .table-container { overflow-x: auto; min-height: 200px; }
        table { width: 100%; border-collapse: collapse; font-size: 11px; }
        th { text-align: left; color: var(--text-label); padding: 10px; border-bottom: 1px solid #eee; text-transform: uppercase; }
        td { padding: 12px 10px; border-bottom: 1px solid #f9f9f9; white-space: nowrap; }
        .pagination { display: flex; justify-content: center; align-items: center; gap: 15px; margin-top: 15px; }
        .btn-nav { background: var(--input-bg); color: var(--primary); border: none; width: 35px; height: 35px; border-radius: 50%; font-weight: bold; cursor: pointer; }
        .btn-nav:disabled { opacity: 0.3; cursor: not-allowed; }
        .badge-info { font-size: 10px; background: #eef2f7; padding: 4px 8px; border-radius: 8px; color: var(--primary); font-weight: bold; }
        .hidden { display: none; }
        .chart-container { height: 250px; width: 100%; }
        @media (max-width: 480px) { .container { padding: 0 10px; } table { font-size: 9px; } td, th { padding: 8px 3px; } }
    </style>
</head>
<body>

    <header>
        <img src="https://raw.githubusercontent.com/eduardoletelier1116-blip/app-pesaje-manzana/main/fondo-blanco.jpg" class="logo" alt="Fresh-Pak">
        <h1>Control de Pesos</h1>
        <p>Gestión de Empaque • R02 POE 29</p>
    </header>

    <div class="container">
        <div class="card" id="loginCard">
            <label>Acceso Personal</label>
            <input type="text" id="nombreOperador" placeholder="OPERADOR">
            <input type="password" id="claveOperador" placeholder="CLAVE">
            <button onclick="ingresarOperador()">Entrar</button>
            <p id="msgLogin" style="color:red; font-size: 12px; text-align: center; margin-top: 10px;"></p>
        </div>

        <div class="card hidden" id="objetivosCard">
            <div class="collapsible-header" onclick="toggleObjetivos()">
                <span>⚙️ Configuración de Objetivos</span>
                <span id="iconToggle">▼</span>
            </div>
            <div class="collapsible-content" id="contentObjetivos">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                    <div><label>precalibre</label><input type="number" id="calibreDesde" placeholder="72"></div>
                    <div><label>sobrecalibre</label><input type="number" id="calibreHasta" placeholder="125"></div>
                </div>
                <label>Peso Objetivo (kg)</label>
                <input type="text" id="pesoObjetivo" placeholder="19.1">
                <button onclick="agregarReglaObjetivo()" style="background:#4caf50; margin-bottom:15px;">Añadir Regla</button>
                <div class="table-container" style="min-height: auto;">
                    <table><tbody id="tablaObjetivos"></tbody></table>
                </div>
            </div>
        </div>

        <div class="card hidden" id="formCard">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                <div><label>Operador</label><input type="text" id="operador" readonly></div>
                <div><label>Exportadora</label><select id="exportadora" onchange="actualizarGraficoDesdeFiltro()"><option value="">Detectar...</option><option>Fruclem</option><option>SK Gyan</option><option>JHB</option><option>Talamaya</option></select></div>
            </div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                <div><label>Variedad</label><select id="variedad" onchange="actualizarGraficoDesdeFiltro()"><option value="">Variedad</option><option>Royal Gala</option><option>Red Delicious</option><option>Granny</option><option>Fuji</option><option>Pink Lady</option></select></div>
                <div><label>Salida</label><select id="salida"></select></div>
            </div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                <div><label>Categoría</label><select id="categoria"><option value="Premium">Premium</option><option value="Extra">Extra</option><option value="Fancy">Fancy</option><option value="Choice">Choice</option></select></div>
                <div><label>Calibre</label><input type="text" id="calibre" placeholder="Ej: 100"></div>
            </div>
            
            <div class="input-group">
                <div>
                    <label>Lote</label>
                    <input type="text" id="lote" placeholder="Lote N°">
                </div>
                <div>
                    <label>Peso (kg)</label>
                    <input type="number" step="0.01" id="peso" placeholder="0.0" style="font-size: 20px; font-weight: bold; color: var(--primary); text-align: center;">
                </div>
            </div>
            <button type="submit" id="btnGuardar">Guardar Registro</button>
            <p id="msg" style="text-align:center; font-weight:bold; color:green;"></p>
        </div>

        <div class="card hidden" id="graficoCard">
            <label id="tituloGrafico">Seguimiento de Calibres</label>
            <div class="chart-container"><canvas id="graficoPesos"></canvas></div>
            <div class="badge-info" id="infoObjetivos" style="margin-top:10px; display:block; text-align:center;"></div>
        </div>

        <div class="card hidden" id="registrosCard">
            <label>Historial del Día</label>
            <div class="table-container">
                <table>
                    <thead><tr><th>Hora</th><th>Op.</th><th>Sal.</th><th>Cat.</th><th>Cal</th><th>Lote</th><th>Peso</th></tr></thead>
                    <tbody id="tabla"></tbody>
                </table>
            </div>
            <div class="pagination">
                <button class="btn-nav" id="btnPrev" onclick="cambiarPagina(-1)">‹</button>
                <span id="pageLabel" style="font-size: 12px; font-weight: bold; color: var(--primary);">1 / 1</span>
                <button class="btn-nav" id="btnNext" onclick="cambiarPagina(1)">›</button>
            </div>
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwkKbW5dlOgY66tCeAHVo4Ceqlsn5aH6Thkticjhw8RfUhXtdI4wscqfliLFmlkLXIp/exec";
        const salidaSelect = document.getElementById("salida");
        let grafico = null;
        let reglasObjetivo = [];
        let registrosDiaFull = [];
        let paginaActual = 1;
        const filasPorPagina = 5;

        for (let i = 1; i <= 41; i++) {
            let option = document.createElement("option");
            option.value = i; option.text = i;
            salidaSelect.appendChild(option);
        }

        function toggleObjetivos() {
            const content = document.getElementById("contentObjetivos");
            const icon = document.getElementById("iconToggle");
            content.classList.toggle("open");
            icon.innerText = content.classList.contains("open") ? "▲" : "▼";
        }

        let operadorData = { operador: "" };

        function normalizarNumero(valor) {
            return parseFloat(String(valor).trim().replace(",", ".")) || 0;
        }

        function filtrarRegistrosPorDia(registros) {
            const hoy = new Date().toISOString().split('T')[0];
            return registros.filter(row => row[0] === hoy);
        }

        function actualizarTabla() {
            const tbody = document.getElementById("tabla");
            tbody.innerHTML = "";
            const totalPaginas = Math.ceil(registrosDiaFull.length / filasPorPagina) || 1;
            if (paginaActual > totalPaginas) paginaActual = totalPaginas;
            const inicio = (paginaActual - 1) * filasPorPagina;
            const filtrados = [...registrosDiaFull].reverse().slice(inicio, inicio + filasPorPagina);
            filtrados.forEach(row => {
                tbody.innerHTML += `<tr><td>${row[1]}</td><td>${row[2]}</td><td>${row[4]}</td><td>${row[6]}</td><td>${row[5]}</td><td>${row[8]}</td><td><b>${row[9]}</b></td></tr>`;
            });
            document.getElementById("pageLabel").innerText = `${paginaActual} / ${totalPaginas}`;
            document.getElementById("btnPrev").disabled = paginaActual === 1;
            document.getElementById("btnNext").disabled = paginaActual === totalPaginas;
        }

        function cambiarPagina(dir) { paginaActual += dir; actualizarTabla(); }

        function renderTablaObjetivos() {
            const tbody = document.getElementById("tablaObjetivos");
            tbody.innerHTML = "";
            reglasObjetivo.forEach((regla, index) => {
                tbody.innerHTML += `<tr><td>C${regla.desde}-C${regla.hasta}</td><td><b>${regla.objetivo}kg</b></td><td><span onclick="eliminarRegla(${index})" style="color:red; cursor:pointer;">✕</span></td></tr>`;
            });
        }

        function agregarReglaObjetivo() {
            const desde = document.getElementById("calibreDesde").value;
            const hasta = document.getElementById("calibreHasta").value;
            const objetivo = document.getElementById("pesoObjetivo").value;
            if (!desde || !hasta || !objetivo) return;
            reglasObjetivo.push({ desde, hasta, objetivo });
            renderTablaObjetivos();
            document.getElementById("calibreDesde").value = ""; document.getElementById("calibreHasta").value = ""; document.getElementById("pesoObjetivo").value = "";
        }

        function eliminarRegla(index) { reglasObjetivo.splice(index, 1); renderTablaObjetivos(); }

        function cargarRegistros() {
            fetch(SCRIPT_URL + "?t=" + new Date().getTime())
                .then(res => res.json())
                .then(data => {
                    registrosDiaFull = filtrarRegistrosPorDia(data);
                    actualizarTabla();
                });
        }

        function ingresarOperador() {
            const n = document.getElementById("nombreOperador").value;
            if (document.getElementById("claveOperador").value === "fresh") {
                operadorData.operador = n;
                document.getElementById("operador").value = n;
                document.getElementById("loginCard").classList.add("hidden");
                ["formCard", "objetivosCard", "graficoCard", "registrosCard"].forEach(id => document.getElementById(id).classList.remove("hidden"));
                cargarRegistros();
            } else { document.getElementById("msgLogin").innerText = "Clave incorrecta"; }
        }

        document.getElementById("btnGuardar").onclick = function() {
            const data = { operador: operadorData.operador, exportadora: document.getElementById("exportadora").value, salida: document.getElementById("salida").value, calibre: document.getElementById("calibre").value, categoria: document.getElementById("categoria").value, variedad: document.getElementById("variedad").value, lote: document.getElementById("lote").value, peso: document.getElementById("peso").value };
            fetch(SCRIPT_URL, { method: "POST", body: new URLSearchParams(data) })
                .then(() => {
                    document.getElementById("msg").innerText = "Guardado";
                    cargarRegistros();
                    setTimeout(() => document.getElementById("msg").innerText = "", 2000);
                });
        };
    </script>
</body>
</html>
