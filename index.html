<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Pesos Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --primary-blue: #2563eb; --bg-body: #f1f5f9; }
        body { background-color: var(--bg-body); padding: 10px; font-family: 'Segoe UI', sans-serif; }
        .card { border-radius: 28px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); border: none; max-width: 600px; margin: auto; background: #fff; margin-bottom: 20px; }
        .header-app { padding: 20px; text-align: center; border-bottom: 1px solid #e2e8f0; }
        .form-control, .form-select { border-radius: 14px !important; padding: 10px; background-color: #f8fafc; border: 1px solid #e2e8f0; }
        .btn-primary { border-radius: 18px; padding: 12px; font-weight: 800; background: var(--primary-blue); border: none; }
        .table { font-size: 0.75rem; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container py-3">
    <div class="card" id="loginCard"><div class="header-app"><h5>Ingreso</h5></div><div class="card-body p-4"><input type="text" id="nombreOperador" class="form-control mb-3" placeholder="Operador"><input type="password" id="claveOperador" class="form-control mb-3" placeholder="Clave"><button class="btn btn-primary w-100" onclick="ingresarOperador()">ENTRAR</button></div></div>

    <div class="card hidden" id="formCard">
        <div class="card-body">
            <form id="form">
                <input type="text" id="operador" class="form-control mb-2" readonly>
                <div class="row g-2">
                    <div class="col-4"><select id="salida" class="form-select mb-2"><option value="">Salida</option></select></div>
                    <div class="col-4"><input type="text" id="calibre" class="form-control" placeholder="Calibre"></div>
                    <div class="col-4"><input type="number" step="0.01" id="peso" class="form-control" placeholder="Peso" required></div>
                </div>
                <button type="submit" class="btn btn-primary w-100">GUARDAR</button>
            </form>
        </div>
    </div>

    <div class="card" id="graficoCard">
        <div class="card-body">
            <h5>Gráfico con Objetivos</h5>
            <div style="height: 300px;"><canvas id="graficoPesos"></canvas></div>
        </div>
    </div>
</div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwkKbW5dlOgY66tCeAHVo4Ceqlsn5aH6Thkticjhw8RfUhXtdI4wscqfliLFmlkLXIp/exec";
    let miGrafico = null;
    // Regla de ejemplo (puedes expandir esto)
    const objetivos = { "72": 19.1, "125": 20.1 };

    function cargarRegistros() {
        fetch(SCRIPT_URL + "?t=" + new Date().getTime())
            .then(res => res.json())
            .then(data => {
                const ctx = document.getElementById('graficoPesos').getContext('2d');
                if (miGrafico) miGrafico.destroy();
                
                const calibres = [...new Set(data.slice(-15).map(r => r[5]))];
                let datasets = [];

                calibres.forEach((cal, i) => {
                    const color = `hsl(${i * 80}, 70%, 50%)`;
                    // Línea real
                    datasets.push({
                        label: `Cal ${cal}`,
                        data: data.slice(-15).filter(r => r[5] == cal).map(r => r[9]),
                        borderColor: color, borderWidth: 3, tension: 0.3
                    });
                    // Línea objetivo (Segmentada)
                    if(objetivos[cal]) {
                        datasets.push({
                            label: `Obj ${cal}`,
                            data: Array(15).fill(objetivos[cal]),
                            borderColor: color, borderDash: [5, 5], borderWidth: 2, pointRadius: 0
                        });
                    }
                });

                miGrafico = new Chart(ctx, {
                    type: 'line',
                    data: { labels: Array(15).fill(''), datasets: datasets },
                    options: { responsive: true, maintainAspectRatio: false }
                });
            });
    }

    function ingresarOperador() {
        if (document.getElementById("claveOperador").value === "fresh") {
            document.getElementById("operador").value = document.getElementById("nombreOperador").value;
            document.getElementById("loginCard").classList.add("hidden");
            document.getElementById("formCard").classList.remove("hidden");
        }
    }

    document.getElementById("form").addEventListener("submit", (e) => {
        e.preventDefault();
        const data = { operador: document.getElementById("operador").value, salida: document.getElementById("salida").value, calibre: document.getElementById("calibre").value, peso: document.getElementById("peso").value };
        fetch(SCRIPT_URL, { method: "POST", body: new URLSearchParams(data) }).then(cargarRegistros);
    });

    window.onload = cargarRegistros;
</script>
</body>
</html>
