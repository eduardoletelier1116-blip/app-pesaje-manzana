<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Pesos | Fresh-Pak</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            --bg-app: #f4f7f9;
            --card-bg: #ffffff;
            --primary: #003366;
            --text-label: #8e9aaf;
            --text-main: #2d3436;
            --input-bg: #f1f3f6;
            --border-radius: 24px;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }

        body { 
            font-family: 'Segoe UI', sans-serif; 
            background-color: var(--bg-app); 
            margin: 0; 
            color: var(--text-main);
            padding-bottom: 40px;
        }

        header { 
            text-align: center; 
            padding: 30px 20px; 
            background: white; 
            border-bottom-left-radius: var(--border-radius);
            border-bottom-right-radius: var(--border-radius);
            margin-bottom: 20px;
        }

        .logo { 
            height: 45px; 
            margin-bottom: 10px; 
        }

        header h1 { 
            font-size: 18px; 
            margin: 0; 
            color: var(--primary); 
            text-transform: uppercase; 
            letter-spacing: 1px; 
        }

        header p { 
            font-size: 12px; 
            color: var(--text-label); 
            margin: 5px 0 0; 
            text-transform: uppercase; 
        }

        .container { 
            max-width: 500px; 
            margin: auto; 
            padding: 0 15px; 
        }

        .card { 
            background: var(--card-bg); 
            padding: 25px; 
            border-radius: var(--border-radius); 
            box-shadow: var(--shadow); 
            margin-bottom: 20px; 
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .form-grid > div {
            min-width: 0;
        }

        label { 
            display: block; 
            font-size: 11px; 
            font-weight: 800; 
            color: var(--text-label); 
            margin-bottom: 8px; 
            text-transform: uppercase; 
            padding-left: 5px;
            letter-spacing: 0.8px;
        }

        input, select { 
            width: 100%; 
            height: 54px;
            min-height: 54px;
            padding: 0 14px; 
            border: none; 
            background: var(--input-bg); 
            border-radius: 15px; 
            box-sizing: border-box; 
            font-size: 15px;
            color: var(--text-main);
            margin-bottom: 15px;
            font-weight: 500;
        }

        input:focus,
        select:focus { 
            outline: 2px solid #dfe6e9; 
        }

        #peso,
        #editPeso {
            font-size: 24px;
            font-weight: bold;
            color: var(--primary);
            text-align: center;
        }

        button { 
            width: 100%; 
            background: var(--primary); 
            color: white; 
            border: none; 
            padding: 16px; 
            border-radius: 15px; 
            font-weight: 700; 
            text-transform: uppercase;
            cursor: pointer;
            transition: 0.3s;
            letter-spacing: 1px;
        }

        button:hover { 
            opacity: 0.9; 
            transform: translateY(-1px); 
        }


        .btn-tv {
            background: #111827;
            margin-top: 12px;
        }

        .btn-tv:hover {
            opacity: 0.95;
        }

        .collapsible-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            color: var(--primary);
            font-weight: 700;
            font-size: 13px;
            text-transform: uppercase;
        }

        .collapsible-content { 
            max-height: 0; 
            overflow: hidden; 
            transition: max-height 0.3s ease-out; 
            margin-top: 0;
        }

        .collapsible-content.open { 
            max-height: 1000px; 
            margin-top: 20px; 
        }

        .table-container { 
            overflow-x: auto; 
            min-height: 200px; 
        }

        table { 
            width: 100%; 
            border-collapse: collapse; 
            font-size: 11px; 
        }

        th { 
            text-align: left; 
            color: var(--text-label); 
            padding: 10px; 
            border-bottom: 1px solid #eee; 
            text-transform: uppercase; 
        }

        td { 
            padding: 12px 10px; 
            border-bottom: 1px solid #f9f9f9; 
            white-space: nowrap; 
        }

        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-top: 15px;
        }

        .btn-nav {
            background: var(--input-bg);
            color: var(--primary);
            border: none;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            font-weight: bold;
            cursor: pointer;
            padding: 0;
        }

        .btn-nav:disabled { 
            opacity: 0.3; 
            cursor: not-allowed; 
        }

        .badge-info { 
            font-size: 10px; 
            background: #eef2f7; 
            padding: 4px 8px; 
            border-radius: 8px; 
            color: var(--primary); 
            font-weight: bold; 
        }

        .hidden { 
            display: none; 
        }

        .chart-container { 
            height: 300px; 
            width: 100%; 
        }

        .historial-filtros {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }

        .historial-filtros input,
        .historial-filtros select {
            margin-bottom: 0;
        }

        .btn-limpiar-filtros {
            background: #eef2f7;
            color: var(--primary);
            font-size: 11px;
            padding: 12px;
            height: 54px;
        }

        .resumen-filtros {
            font-size: 10px;
            color: var(--text-label);
            text-align: center;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .acciones-registro {
            display: flex;
            gap: 5px;
            align-items: center;
        }

        .btn-accion {
            width: auto;
            height: 28px;
            padding: 0 8px;
            border-radius: 8px;
            font-size: 9px;
            letter-spacing: 0;
            margin: 0;
        }

        .btn-editar {
            background: #2a5298;
        }

        .btn-eliminar {
            background: #e74c3c;
        }

        .btn-secundario {
            background: #eef2f7;
            color: var(--primary);
        }

        .btn-guardar-edicion {
            background: #4caf50;
        }

        .edit-alerta {
            background: #eef2f7;
            color: var(--primary);
            font-size: 11px;
            font-weight: bold;
            border-radius: 12px;
            padding: 10px;
            margin-bottom: 15px;
            text-align: center;
        }

        @media (max-width: 480px) {
            .container { 
                padding: 0 12px; 
            }

            .card {
                padding: 22px 16px;
                border-radius: 22px;
            }

            .form-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 12px;
            }

            label {
                font-size: 10px;
                min-height: 14px;
                margin-bottom: 7px;
                padding-left: 2px;
            }

            input,
            select {
                width: 100%;
                height: 54px;
                min-height: 54px;
                padding: 0 12px;
                margin-bottom: 15px;
                font-size: 16px;
                line-height: 1.2;
                border-radius: 15px;
                box-sizing: border-box;
                appearance: none;
                -webkit-appearance: none;
            }

            select {
                background-color: var(--input-bg);
                background-image:
                    linear-gradient(45deg, transparent 50%, var(--text-main) 50%),
                    linear-gradient(135deg, var(--text-main) 50%, transparent 50%);
                background-position:
                    calc(100% - 18px) 50%,
                    calc(100% - 12px) 50%;
                background-size: 6px 6px, 6px 6px;
                background-repeat: no-repeat;
                padding-right: 34px;
            }

            #peso,
            #editPeso {
                height: 54px;
                min-height: 54px;
                font-size: 24px;
                text-align: center;
                padding: 0 12px;
            }

            button {
                height: 56px;
                padding: 0 16px;
                font-size: 13px;
            }

            .historial-filtros {
                grid-template-columns: 1fr 1fr;
                gap: 8px;
            }

            .btn-limpiar-filtros {
                height: 54px;
                font-size: 10px;
                padding: 0 10px;
            }

            table {
                font-size: 9px;
            }

            td,
            th {
                padding: 8px 3px;
            }

            .chart-container {
                height: 260px;
            }

            .acciones-registro {
                flex-direction: column;
                gap: 4px;
            }

            .btn-accion {
                height: 26px;
                padding: 0 6px;
                font-size: 8px;
            }
        }
    </style>
</head>

<body>

    <header>
        <img src="https://raw.githubusercontent.com/eduardoletelier1116-blip/app-pesaje-manzana/main/fondo-blanco.jpg" class="logo" alt="Fresh-Pak">
        <h1>Control de Pesos</h1>
        <p>Gestión de Empaque • R02 POE 29</p>
    </header>

    <div class="container">
        
        <div class="card" id="loginCard">
            <label>Acceso Personal</label>
            <input type="text" id="nombreOperador" placeholder="OPERADOR">
            <input type="password" id="claveOperador" placeholder="CLAVE">
            <button onclick="ingresarOperador()">Entrar</button>

            <button type="button" class="btn-tv" onclick="abrirModoTV()">
                📺 Entrar a Monitor
            </button>

            <p id="msgLogin" style="color:red; font-size: 12px; text-align: center; margin-top: 10px;"></p>
        </div>

        <div class="card hidden" id="monitorCard">
            <label>Monitor de Resultados</label>
            <button type="button" class="btn-tv" onclick="abrirModoTV()">
                📺 Entrar a Monitor
            </button>
        </div>

        <div class="card hidden" id="objetivosCard">
            <div class="collapsible-header" onclick="toggleObjetivos()">
                <span>⚙️ Configuración de Objetivos</span>
                <span id="iconToggle">▼</span>
            </div>

            <div class="collapsible-content" id="contentObjetivos">
                <div class="form-grid">
                    <div>
                        <label>Desde (Cal)</label>
                        <input type="number" id="calibreDesde" placeholder="72">
                    </div>

                    <div>
                        <label>Hasta (Cal)</label>
                        <input type="number" id="calibreHasta" placeholder="125">
                    </div>
                </div>

                <label>Peso Objetivo (kg)</label>
                <input type="text" id="pesoObjetivo" placeholder="19.1">

                <button onclick="agregarReglaObjetivo()" style="background:#4caf50; margin-bottom:15px;">Añadir Regla</button>
                
                <div class="table-container" style="min-height: auto;">
                    <table>
                        <tbody id="tablaObjetivos"></tbody>
                    </table>
                </div>

                <button class="hidden" onclick="limpiarObjetivos()" style="background:#e74c3c; margin-top:10px; padding:8px; font-size:10px;">Limpiar Reglas</button>
            </div>
        </div>

        <div class="card hidden" id="formCard">

            <div class="form-grid">
                <div>
                    <label>Operador</label>
                    <input type="text" id="operador" readonly>
                </div>

                <div>
                    <label>Exportadora</label>
                    <select id="exportadora" required onchange="actualizarGraficoDesdeFiltro()">
                        <option value="">Detectar...</option>
                        <option>Fruclem</option>
                        <option>SK Gyan</option>
                        <option>JHB</option>
                        <option>Talamaya</option>
                    </select>
                </div>
            </div>

            <div class="form-grid">
                <div>
                    <label>Variedad</label>
                    <select id="variedad" required onchange="actualizarGraficoDesdeFiltro()">
                        <option value="">Variedad</option>
                        <option>Royal Gala</option>
                        <option>Red Delicious</option>
                        <option>Granny</option>
                        <option>Fuji</option>
                        <option>Pink Lady</option>
                    </select>
                </div>

                <div>
                    <label>Salida</label>
                    <select id="salida" required></select>
                </div>
            </div>

            <div class="form-grid">
                <div>
                    <label>Categoría</label>
                    <select id="categoria" required>
                        <option value="Premium">Premium</option>
                        <option value="Extra">Extra</option>
                        <option value="Fancy">Fancy</option>
                        <option value="Choice">Choice</option>
                    </select>
                </div>

                <div>
                    <label>Calibre</label>
                    <input type="text" id="calibre" placeholder="Ej: 100" required>
                </div>
            </div>

            <div class="form-grid">
                <div>
                    <label>Lote</label>
                    <input type="text" id="lote" placeholder="Lote N°" required>
                </div>

                <div>
                    <label>Peso (kg)</label>
                    <input type="number" step="0.01" id="peso" placeholder="0.0" required>
                </div>
            </div>
            
            <button type="submit" id="btnGuardar">Guardar Registro</button>
            <p id="msg" style="text-align:center; font-weight:bold; color:green;"></p>
        </div>

        <div class="card hidden" id="editarRegistroCard">
            <label>Editar registro del día</label>

            <div class="edit-alerta">
                Solo se permite modificar registros del día actual.
            </div>

            <input type="hidden" id="editFila">
            <input type="hidden" id="editFechaOriginal">
            <input type="hidden" id="editHoraOriginal">
            <input type="hidden" id="editOperadorOriginal">

            <div class="form-grid">
                <div>
                    <label>Operador</label>
                    <input type="text" id="editOperador" readonly>
                </div>

                <div>
                    <label>Exportadora</label>
                    <select id="editExportadora">
                        <option value="">Detectar...</option>
                        <option>Fruclem</option>
                        <option>SK Gyan</option>
                        <option>JHB</option>
                        <option>Talamaya</option>
                    </select>
                </div>
            </div>

            <div class="form-grid">
                <div>
                    <label>Variedad</label>
                    <select id="editVariedad">
                        <option value="">Variedad</option>
                        <option>Royal Gala</option>
                        <option>Red Delicious</option>
                        <option>Granny</option>
                        <option>Fuji</option>
                        <option>Pink Lady</option>
                    </select>
                </div>

                <div>
                    <label>Salida</label>
                    <select id="editSalida"></select>
                </div>
            </div>

            <div class="form-grid">
                <div>
                    <label>Categoría</label>
                    <select id="editCategoria">
                        <option value="Premium">Premium</option>
                        <option value="Extra">Extra</option>
                        <option value="Fancy">Fancy</option>
                        <option value="Choice">Choice</option>
                    </select>
                </div>

                <div>
                    <label>Calibre</label>
                    <input type="text" id="editCalibre" placeholder="Ej: 100">
                </div>
            </div>

            <div class="form-grid">
                <div>
                    <label>Lote</label>
                    <input type="text" id="editLote" placeholder="Lote N°">
                </div>

                <div>
                    <label>Peso (kg)</label>
                    <input type="number" step="0.01" id="editPeso" placeholder="0.0">
                </div>
            </div>

            <div class="form-grid">
                <button type="button" class="btn-guardar-edicion" id="btnGuardarEdicion" onclick="guardarEdicionRegistro()">Guardar cambios</button>
                <button type="button" class="btn-secundario" onclick="cancelarEdicion()">Cancelar</button>
            </div>

            <p id="msgEdit" style="text-align:center; font-weight:bold; color:green;"></p>
        </div>

        <div class="card hidden" id="graficoCard">
            <label id="tituloGrafico">Seguimiento de Calibres</label>

            <div class="chart-container">
                <canvas id="graficoPesos"></canvas>
            </div>

            <div class="badge-info" id="infoObjetivos" style="margin-top:10px; display:block; text-align:center;"></div>
        </div>

        <div class="card hidden" id="registrosCard">
            <label>Historial del Día</label>

            <div class="historial-filtros">
                <input 
                    type="text" 
                    id="filtroHistorialTexto" 
                    placeholder="Buscar..."
                    oninput="aplicarFiltrosHistorial()"
                >

                <select 
                    id="filtroHistorialSalida" 
                    onchange="aplicarFiltrosHistorial()"
                >
                    <option value="">Todas salidas</option>
                </select>

                <select 
                    id="filtroHistorialCategoria" 
                    onchange="aplicarFiltrosHistorial()"
                >
                    <option value="">Todas categorías</option>
                    <option value="Premium">Premium</option>
                    <option value="Extra">Extra</option>
                    <option value="Fancy">Fancy</option>
                    <option value="Choice">Choice</option>
                </select>

                <button 
                    type="button" 
                    class="btn-limpiar-filtros" 
                    onclick="limpiarFiltrosHistorial()"
                >
                    Limpiar
                </button>
            </div>

            <div class="resumen-filtros" id="resumenFiltrosHistorial">
                Mostrando registros del día
            </div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Hora</th>
                            <th>Op.</th>
                            <th>Sal.</th>
                            <th>Cat.</th>
                            <th>Cal</th>
                            <th>Lote</th>
                            <th>Peso</th>
                            <th>Acc.</th>
                        </tr>
                    </thead>
                    <tbody id="tabla"></tbody>
                </table>
            </div>

            <div class="pagination">
                <button class="btn-nav" id="btnPrev" onclick="cambiarPagina(-1)">‹</button>
                <span id="pageLabel" style="font-size: 12px; font-weight: bold; color: var(--primary);">1 / 1</span>
                <button class="btn-nav" id="btnNext" onclick="cambiarPagina(1)">›</button>
            </div>

            <div id="estadoSync" style="font-size:10px; color:#ccc; text-align:right; margin-top:10px;">Sincronizando...</div>
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwjq7iM3-S1q9ZSJFiuYf3ZIPT5oDHl5eAOnUJCmycik_-5Oml72qx27_hhNVYlJNxl/exec";

        // Archivo del monitor. Debe existir en el mismo repositorio/carpeta que este index.html.
        // Si tu archivo del modo TV tiene otro nombre, cambia solo esta línea.
        const TV_URL = "tv.html";

        function abrirModoTV() {
            window.open(TV_URL, "_blank");
        }
        const salidaSelect = document.getElementById("salida");
        const filtroSalidaSelect = document.getElementById("filtroHistorialSalida");
        const editSalidaSelect = document.getElementById("editSalida");
        const estadoSync = document.getElementById("estadoSync");

        let grafico = null;
        let cargando = false;
        let reglasObjetivo = [];
        
        let registrosDiaFull = [];
        let registrosPaginaActual = [];
        let paginaActual = 1;
        const filasPorPagina = 5;

        for (let i = 1; i <= 41; i++) {
            let option = document.createElement("option");
            option.value = i;
            option.text = i;
            salidaSelect.appendChild(option);

            let optionFiltro = document.createElement("option");
            optionFiltro.value = i;
            optionFiltro.text = i;
            filtroSalidaSelect.appendChild(optionFiltro);

            let optionEdit = document.createElement("option");
            optionEdit.value = i;
            optionEdit.text = i;
            editSalidaSelect.appendChild(optionEdit);
        }

        function toggleObjetivos() {
            const content = document.getElementById("contentObjetivos");
            const icon = document.getElementById("iconToggle");

            content.classList.toggle("open");
            icon.innerText = content.classList.contains("open") ? "▲" : "▼";
        }

        let operadorData = { operador: "" };

        function normalizarNumero(valor) {
            if (valor === null || valor === undefined) return NaN;
            const limpio = String(valor).trim().replace(",", ".");
            return parseFloat(limpio);
        }

        function filtrarRegistrosPorDia(registros) {
            const hoy = new Date();
            const dia = String(hoy.getDate()).padStart(2, "0");
            const mes = String(hoy.getMonth() + 1).padStart(2, "0");
            const fechaHoy = `${hoy.getFullYear()}-${mes}-${dia}`;

            return registros.filter(row => {
                if (!row || row.length < 10) return false;

                let fReg = String(row[0] || "");

                if (fReg.includes("/")) {
                    const p = fReg.split("/");
                    fReg = `${p[2]}-${p[1].padStart(2,"0")}-${p[0].padStart(2,"0")}`;
                }

                return fReg === fechaHoy;
            });
        }

        function generarColor(index) {
            const colores = ["#1e3c72", "#2a5298", "#4caf50", "#ff9800", "#e91e63", "#00bcd4"];
            return colores[index % colores.length];
        }

        function obtenerRegistrosFiltrados() {
            const texto = document.getElementById("filtroHistorialTexto").value.trim().toLowerCase();
            const salidaFiltro = document.getElementById("filtroHistorialSalida").value;
            const categoriaFiltro = document.getElementById("filtroHistorialCategoria").value;

            return registrosDiaFull.filter(row => {
                const hora = String(row[1] || "").toLowerCase();
                const operador = String(row[2] || "").toLowerCase();
                const exportadora = String(row[3] || "").toLowerCase();
                const salida = String(row[4] || "").trim();
                const calibre = String(row[5] || "").toLowerCase();
                const categoria = String(row[6] || "").trim();
                const variedad = String(row[7] || "").toLowerCase();
                const lote = String(row[8] || "").toLowerCase();
                const peso = String(row[9] || "").toLowerCase();

                const coincideTexto = !texto || 
                    hora.includes(texto) ||
                    operador.includes(texto) ||
                    exportadora.includes(texto) ||
                    salida.includes(texto) ||
                    calibre.includes(texto) ||
                    categoria.toLowerCase().includes(texto) ||
                    variedad.includes(texto) ||
                    lote.includes(texto) ||
                    peso.includes(texto);

                const coincideSalida = !salidaFiltro || salida === salidaFiltro;
                const coincideCategoria = !categoriaFiltro || categoria === categoriaFiltro;

                return coincideTexto && coincideSalida && coincideCategoria;
            });
        }

        function aplicarFiltrosHistorial() {
            paginaActual = 1;
            actualizarTabla();
        }

        function limpiarFiltrosHistorial() {
            document.getElementById("filtroHistorialTexto").value = "";
            document.getElementById("filtroHistorialSalida").value = "";
            document.getElementById("filtroHistorialCategoria").value = "";

            paginaActual = 1;
            actualizarTabla();
        }

        function actualizarTabla() {
            const tbody = document.getElementById("tabla");
            tbody.innerHTML = "";

            const registrosFiltrados = obtenerRegistrosFiltrados();
            const totalPaginas = Math.ceil(registrosFiltrados.length / filasPorPagina) || 1;

            if (paginaActual > totalPaginas) paginaActual = totalPaginas;
            if (paginaActual < 1) paginaActual = 1;

            const inicio = (paginaActual - 1) * filasPorPagina;
            const fin = inicio + filasPorPagina;
            
            const filtrados = [...registrosFiltrados].reverse().slice(inicio, fin);
            registrosPaginaActual = filtrados;

            if (filtrados.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="8" style="text-align:center; color: var(--text-label); padding:18px;">
                            Sin registros para este filtro
                        </td>
                    </tr>
                `;
            } else {
                filtrados.forEach((row, index) => {
                    tbody.innerHTML += `<tr>
                        <td>${row[1]}</td>
                        <td>${row[2]}</td>
                        <td>${row[4]}</td>
                        <td>${row[6]}</td>
                        <td>${row[5]}</td>
                        <td>${row[8]}</td>
                        <td><b>${row[9]}</b></td>
                        <td>
                            <div class="acciones-registro">
                                <button type="button" class="btn-accion btn-editar" onclick="iniciarEdicion(${index})">Editar</button>
                                <button type="button" class="btn-accion btn-eliminar" onclick="eliminarRegistroDia(${index})">Eliminar</button>
                            </div>
                        </td>
                    </tr>`;
                });
            }

            document.getElementById("pageLabel").innerText = `${paginaActual} / ${totalPaginas}`;
            document.getElementById("btnPrev").disabled = paginaActual === 1;
            document.getElementById("btnNext").disabled = paginaActual === totalPaginas;

            const total = registrosFiltrados.length;
            document.getElementById("resumenFiltrosHistorial").innerText = 
                `${total} registro${total === 1 ? "" : "s"} visible${total === 1 ? "" : "s"}`;
        }

        function cambiarPagina(dir) {
            paginaActual += dir;
            actualizarTabla();
        }

        function seleccionarValorSelect(idSelect, valor) {
            const select = document.getElementById(idSelect);
            const valorTexto = String(valor || "").trim();

            if (!valorTexto) {
                select.value = "";
                return;
            }

            const existe = Array.from(select.options).some(option => option.value === valorTexto || option.text === valorTexto);

            if (!existe) {
                const option = document.createElement("option");
                option.value = valorTexto;
                option.text = valorTexto;
                select.appendChild(option);
            }

            select.value = valorTexto;
        }

        function iniciarEdicion(index) {
            const row = registrosPaginaActual[index];
            if (!row) return;

            document.getElementById("editFila").value = row[10];
            document.getElementById("editFechaOriginal").value = row[0];
            document.getElementById("editHoraOriginal").value = row[1];
            document.getElementById("editOperadorOriginal").value = row[2];

            document.getElementById("editOperador").value = row[2] || "";
            seleccionarValorSelect("editExportadora", row[3]);
            seleccionarValorSelect("editSalida", row[4]);
            document.getElementById("editCalibre").value = row[5] || "";
            seleccionarValorSelect("editCategoria", row[6]);
            seleccionarValorSelect("editVariedad", row[7]);
            document.getElementById("editLote").value = row[8] || "";
            document.getElementById("editPeso").value = row[9] || "";

            document.getElementById("msgEdit").innerText = "";
            document.getElementById("editarRegistroCard").classList.remove("hidden");
            document.getElementById("editarRegistroCard").scrollIntoView({ behavior: "smooth", block: "start" });
        }

        function cancelarEdicion() {
            document.getElementById("editarRegistroCard").classList.add("hidden");
            document.getElementById("msgEdit").innerText = "";
        }

        function guardarEdicionRegistro() {
            const btn = document.getElementById("btnGuardarEdicion");
            const msgEdit = document.getElementById("msgEdit");

            btn.disabled = true;
            btn.innerText = "Guardando...";
            msgEdit.innerText = "";

            const data = {
                accion: "editarRegistro",
                fila: document.getElementById("editFila").value,
                fechaOriginal: document.getElementById("editFechaOriginal").value,
                horaOriginal: document.getElementById("editHoraOriginal").value,
                operadorOriginal: document.getElementById("editOperadorOriginal").value,
                exportadora: document.getElementById("editExportadora").value,
                salida: document.getElementById("editSalida").value,
                calibre: document.getElementById("editCalibre").value,
                categoria: document.getElementById("editCategoria").value,
                variedad: document.getElementById("editVariedad").value,
                lote: document.getElementById("editLote").value,
                peso: document.getElementById("editPeso").value
            };

            fetch(SCRIPT_URL, { 
                method: "POST", 
                body: new URLSearchParams(data) 
            })
            .then(res => res.json())
            .then(res => {
                if (!res || res.status !== "success") {
                    throw new Error(res.message || "No se pudo editar el registro.");
                }

                msgEdit.innerText = "Registro actualizado correctamente.";
                
                setTimeout(() => {
                    cancelarEdicion();
                    cargarRegistros();
                }, 700);
            })
            .catch(error => {
                alert(error.message);
            })
            .finally(() => {
                btn.disabled = false;
                btn.innerText = "Guardar cambios";
            });
        }

        function eliminarRegistroDia(index) {
            const row = registrosPaginaActual[index];
            if (!row) return;

            const confirmar = confirm(`¿Seguro que deseas eliminar este registro?\n\nHora: ${row[1]}\nSalida: ${row[4]}\nCalibre: ${row[5]}\nPeso: ${row[9]}`);

            if (!confirmar) return;

            const data = {
                accion: "eliminarRegistro",
                fila: row[10],
                fechaOriginal: row[0],
                horaOriginal: row[1],
                operadorOriginal: row[2]
            };

            fetch(SCRIPT_URL, { 
                method: "POST", 
                body: new URLSearchParams(data) 
            })
            .then(res => res.json())
            .then(res => {
                if (!res || res.status !== "success") {
                    throw new Error(res.message || "No se pudo eliminar el registro.");
                }

                cancelarEdicion();
                cargarRegistros();
            })
            .catch(error => {
                alert(error.message);
            });
        }

        function guardarObjetivosEnServidor() {
            return fetch(SCRIPT_URL, { 
                method: "POST", 
                body: new URLSearchParams({ 
                    accion: "guardarObjetivos", 
                    objetivos: JSON.stringify(reglasObjetivo) 
                }) 
            }).then(res => res.json());
        }

        function cargarObjetivosDesdeServidor() {
            return fetch(SCRIPT_URL + "?tipo=objetivos&t=" + new Date().getTime())
                .then(res => res.json())
                .then(data => {
                    if (!Array.isArray(data)) { 
                        reglasObjetivo = []; 
                        return; 
                    }

                    reglasObjetivo = data
                        .filter((row, index) => row && row.length >= 3 && index > 0)
                        .map(r => ({ 
                            desde: parseInt(r[0], 10), 
                            hasta: parseInt(r[1], 10), 
                            objetivo: Number(normalizarNumero(r[2]).toFixed(2)) 
                        }))
                        .filter(r => !isNaN(r.desde) && !isNaN(r.hasta) && !isNaN(r.objetivo));
                })
                .catch(err => { 
                    console.error("Error objetivos:", err); 
                });
        }

        function renderTablaObjetivos() {
            const tbody = document.getElementById("tablaObjetivos");
            tbody.innerHTML = "";

            reglasObjetivo.forEach((regla, index) => {
                tbody.innerHTML += `<tr>
                    <td>C${regla.desde}-C${regla.hasta}</td>
                    <td><b>${regla.objetivo}kg</b></td>
                    <td><span onclick="eliminarRegla(${index})" style="color:red; cursor:pointer;">✕</span></td>
                </tr>`;
            });

            const texto = reglasObjetivo.map(r => `C${r.desde}-${r.hasta}:${r.objetivo}`).join(" | ");
            document.getElementById("infoObjetivos").innerText = texto || "Sin objetivos";
        }

        function agregarReglaObjetivo() {
            const desde = parseInt(document.getElementById("calibreDesde").value, 10);
            const hasta = parseInt(document.getElementById("calibreHasta").value, 10);
            const objetivo = normalizarNumero(document.getElementById("pesoObjetivo").value);

            if (isNaN(desde) || isNaN(hasta) || isNaN(objetivo)) return;

            reglasObjetivo.push({ 
                desde, 
                hasta, 
                objetivo: Number(objetivo.toFixed(2)) 
            });

            guardarObjetivosEnServidor().then(() => { 
                renderTablaObjetivos(); 
                cargarRegistros(); 
            });

            document.getElementById("calibreDesde").value = "";
            document.getElementById("calibreHasta").value = "";
            document.getElementById("pesoObjetivo").value = "";
        }

        function eliminarRegla(index) {
            reglasObjetivo.splice(index, 1);

            guardarObjetivosEnServidor().then(() => { 
                renderTablaObjetivos(); 
                cargarRegistros(); 
            });
        }

        function limpiarObjetivos() {
            reglasObjetivo = [];

            guardarObjetivosEnServidor().then(() => { 
                renderTablaObjetivos(); 
                cargarRegistros(); 
            });
        }

        function obtenerObjetivoPorCalibre(calibre) {
            const c = parseInt(calibre, 10);

            for (const r of reglasObjetivo) { 
                if (c >= r.desde && c <= r.hasta) return r.objetivo; 
            }

            return null;
        }

        function actualizarGrafico(registros) {
            const canvas = document.getElementById("graficoPesos");
            const ctx = canvas.getContext("2d");

            let expSel = document.getElementById("exportadora").value;
            let varSel = document.getElementById("variedad").value;

            if ((!expSel || expSel === "") && registros.length > 0) {
                const ultimo = registros[registros.length - 1];
                expSel = String(ultimo[3]).trim();
                varSel = String(ultimo[7]).trim();
            }

            if (!registros || registros.length === 0 || !expSel) return;

            const filtrados = registros.filter(row => 
                String(row[3]).trim() === expSel && 
                (varSel ? String(row[7]).trim() === varSel : true)
            );

            const grupos = {};

            filtrados.forEach(row => {
                const cal = String(row[5]).trim();
                const pes = normalizarNumero(row[9]);

                if (!cal || isNaN(pes)) return;

                if (!grupos[cal]) grupos[cal] = [];
                grupos[cal].push(pes);
            });

            const maxCajas = Math.max(...Object.values(grupos).map(a => a.length), 0);
            const labels = Array.from({ length: maxCajas }, (_, i) => `${i + 1}`);
            const datasets = [];
            
            Object.keys(grupos).forEach((cal, idx) => {
                const color = generarColor(idx);

                datasets.push({ 
                    label: `C ${cal}`, 
                    data: grupos[cal], 
                    borderColor: color, 
                    backgroundColor: color, 
                    tension: 0.3, 
                    fill: false 
                });

                const obj = obtenerObjetivoPorCalibre(cal);

                if (obj !== null) {
                    datasets.push({ 
                        label: `Obj`, 
                        data: Array(grupos[cal].length).fill(obj), 
                        borderColor: color, 
                        borderDash: [5, 5], 
                        pointRadius: 0, 
                        fill: false 
                    });
                }
            });

            if (grafico) grafico.destroy();

            grafico = new Chart(ctx, {
                type: "line", 
                data: { 
                    labels, 
                    datasets 
                },
                options: { 
                    responsive: true, 
                    maintainAspectRatio: false, 
                    plugins: { 
                        legend: { 
                            display: false 
                        } 
                    } 
                }
            });
        }

        function cargarRegistros() {
            if (cargando) return;

            cargando = true;

            Promise.all([
                fetch(SCRIPT_URL + "?t=" + new Date().getTime()).then(res => res.json()),
                cargarObjetivosDesdeServidor()
            ])
            .then(([data]) => {
                if (!Array.isArray(data)) {
                    throw new Error(data.message || "No se pudieron cargar los registros.");
                }

                registrosDiaFull = filtrarRegistrosPorDia(data);
                actualizarTabla();
                actualizarGrafico(registrosDiaFull);
                estadoSync.innerText = "Sincronizado: " + new Date().toLocaleTimeString();
                renderTablaObjetivos();
            })
            .catch(error => {
                console.error(error);
                estadoSync.innerText = "Error de sincronización";
            })
            .finally(() => { 
                cargando = false; 
            });
        }

        function actualizarGraficoDesdeFiltro() { 
            cargarRegistros(); 
        }

        function ingresarOperador() {
            const n = document.getElementById("nombreOperador").value.trim();
            const c = document.getElementById("claveOperador").value.trim();

            if (c === "fresh") {
                operadorData.operador = n;
                document.getElementById("operador").value = n;

                document.getElementById("loginCard").classList.add("hidden");

                ["monitorCard", "formCard", "objetivosCard", "graficoCard", "registrosCard"].forEach(id => 
                    document.getElementById(id).classList.remove("hidden")
                );

                cargarRegistros();
                setInterval(cargarRegistros, 10000);
            } else {
                document.getElementById("msgLogin").innerText = "Clave incorrecta";
            }
        }

        document.getElementById("btnGuardar").onclick = function() {
            const btn = this;

            btn.disabled = true;
            btn.innerText = "Guardando...";

            const data = {
                operador: operadorData.operador,
                exportadora: document.getElementById("exportadora").value,
                salida: document.getElementById("salida").value,
                calibre: document.getElementById("calibre").value,
                categoria: document.getElementById("categoria").value,
                variedad: document.getElementById("variedad").value,
                lote: document.getElementById("lote").value,
                peso: document.getElementById("peso").value
            };

            fetch(SCRIPT_URL, { 
                method: "POST", 
                body: new URLSearchParams(data) 
            })
            .then(() => {
                document.getElementById("msg").innerText = "¡Éxito!";
                document.getElementById("calibre").value = "";
                document.getElementById("peso").value = "";

                setTimeout(() => { 
                    document.getElementById("msg").innerText = ""; 
                }, 2000);

                cargarRegistros();
            })
            .finally(() => { 
                btn.disabled = false; 
                btn.innerText = "Guardar Registro"; 
            });
        };
    </script>
</body>
</html>
